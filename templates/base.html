<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{ product }}{% block title %}{% endblock %}</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='app.css') }}">
</head>
<body>
  <nav class="nav">
    <span class="brand">{{ product }}</span>
    <span class="navlinks">
      <a href="{{ url_for('clients') }}" class="{{ 'active' if active=='clients' }}">Clients</a>
      <a href="{{ url_for('invoices') }}" class="{{ 'active' if active=='invoices' }}">Invoices</a>
      <a href="{{ url_for('activity') }}" class="{{ 'active' if active=='activity' }}">Agent Activity</a>
    </span>
    <span class="right">
      <input class="search" placeholder="Search clients, invoices, or anything…" disabled>
      {% if show_ai %}<button class="nav-ai" onclick="toggleAI(true)"><span>✦</span> Receivables AI</button>{% endif %}
      <span class="icon">?</span>
      <span class="avatar">H</span>
    </span>
  </nav>
  <div class="shell">
    <aside class="sidebar">
      <div class="side-head">{{ product }}</div>
      <a href="{{ url_for('clients') }}" class="side-item {{ 'active' if active=='clients' }}">Clients</a>
      <a href="{{ url_for('invoices') }}" class="side-item {{ 'active' if active=='invoices' }}">Invoices</a>
      <a href="{{ url_for('activity') }}" class="side-item {{ 'active' if active=='activity' }}">Agent Activity</a>
      <div class="side-item disabled">Policy &amp; Rules <span class="planned">Planned</span></div>
      <a href="{{ url_for('configure') }}" class="side-item {{ 'active' if active=='configure' }}">Configure</a>
    </aside>
    <main class="main">
      <div class="content {{ 'wide' if wide }}">
        {% block content %}{% endblock %}
        <div class="footer">{{ footer }}</div>
      </div>
    </main>
  </div>

  {% if show_ai %}
  <aside class="airail">
    <div class="airail-head">
      <span class="ait"><span class="ai-ava sm">✦</span> Receivables AI <span class="beta">Beta</span></span>
      <button class="ai-close" onclick="toggleAI(false)" title="Close">×</button>
    </div>
    {% include "_aipanel.html" %}
  </aside>
  <div class="ai-scrim" onclick="toggleAI(false)"></div>
  <script>
    function toggleAI(open){
      document.body.classList.toggle('ai-open', open);
      localStorage.setItem('aiOpen', open ? '1' : '0');
    }
    function copyDraft(btn){
      var el = btn.closest('.ai-bubble').querySelector('.draft-box');
      if(el){ navigator.clipboard.writeText(el.textContent); btn.textContent='Copied'; setTimeout(function(){btn.textContent='Copy';},1500); }
    }
    (function(){
      var q = /[?&](ask|q|arg)=/.test(location.search);
      document.body.classList.toggle('ai-open', q || localStorage.getItem('aiOpen')==='1');
    })();
  </script>
  {% endif %}
</body>
</html>
